name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ["winapp/**", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: winapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow pillow-heif pymupdf pywin32 tkinterdnd2 pyinstaller
      - run: python make_icon.py
      - run: pyinstaller --onefile --windowed --name Converter --icon icon.ico --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all pymupdf main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Converter-windows-exe
          path: winapp/dist/Converter.exe
