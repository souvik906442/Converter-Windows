name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ["main.py", "make_icon.py", "installer.iss", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow pillow-heif pymupdf pywin32 tkinterdnd2 pyinstaller
      - name: Embed remove.bg key
        shell: bash
        env:
          REMOVEBG_KEY: ${{ secrets.REMOVEBG_KEY }}
        run: echo "EMBEDDED_KEY = '$REMOVEBG_KEY'" > _embedded_key.py
      - run: python make_icon.py
      - run: pyinstaller --onefile --windowed --name Converter --icon icon.ico --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all pymupdf main.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build setup installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Converter-Setup
          path: dist/Converter-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Converter-exe
          path: dist/Converter.exe
